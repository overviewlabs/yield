global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    application: whox-treasury

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: agent-orchestrator
    static_configs:
      - targets: ["agent-orchestrator:9464"]
  - job_name: execution-worker
    static_configs:
      - targets: ["execution-worker:9464"]
  - job_name: notification-worker
    static_configs:
      - targets: ["notification-worker:9464"]
  - job_name: market-data-service
    static_configs:
      - targets: ["market-data-service:9464"]
