name: Build and upload Yield to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: true
        default: "1.0"
        type: string
      build_number:
        description: Build number
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - .github/build-now

permissions:
  contents: write

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create temporary signing keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          MAIN_PROFILE_BASE64: ${{ secrets.IOS_YIELD_APP_STORE_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_YIELD_WIDGET_APP_STORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          P12="$RUNNER_TEMP/distribution.p12"
          MAIN_PROFILE="$RUNNER_TEMP/treasury.mobileprovision"
          WIDGET_PROFILE="$RUNNER_TEMP/treasury-widget.mobileprovision"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          printf '%s' "$MAIN_PROFILE_BASE64" | base64 --decode > "$MAIN_PROFILE"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$WIDGET_PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          for profile in "$MAIN_PROFILE" "$WIDGET_PROFILE"; do
            UUID="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          done

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate --spec project.yml

      - name: Apply and verify Swift formatting
        run: |
          set +e
          FORMAT_LOG="$RUNNER_TEMP/swift-format.log"
          xcrun swift-format format --in-place --recursive --parallel \
            apps/ios/Sources apps/ios/Tests apps/ios/UITests apps/ios/Widget \
            >"$FORMAT_LOG" 2>&1
          FORMAT_STATUS=$?
          xcrun swift-format lint --recursive --parallel --strict \
            apps/ios/Sources apps/ios/Tests apps/ios/UITests apps/ios/Widget \
            >>"$FORMAT_LOG" 2>&1
          LINT_STATUS=$?
          if ! git diff --quiet; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add apps/ios/Sources apps/ios/Tests apps/ios/UITests apps/ios/Widget
            git commit -m "Apply Swift formatting"
            git push
          fi
          if [ "$FORMAT_STATUS" -ne 0 ] || [ "$LINT_STATUS" -ne 0 ]; then
            cat "$FORMAT_LOG"
            exit 1
          fi
          set -e

      - name: Archive
        env:
          MARKETING_VERSION: ${{ inputs.version || '1.0' }}
          BUILD_NUMBER: ${{ inputs.build_number || '11' }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/ios/WHOXTreasury.xcodeproj \
            -scheme WHOXTreasury \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WHOXTreasury.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive

      - name: Export signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/WHOXTreasury.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist apps/ios/ci/ExportOptions.plist

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: yield-testflight-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_BASE64"
          KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" \
            | base64 --decode > "$KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8"
          IPA_FILES=("$RUNNER_TEMP"/export/*.ipa)
          test "${#IPA_FILES[@]}" -eq 1
          xcrun altool \
            --upload-app \
            --type ios \
            --file "${IPA_FILES[0]}" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
